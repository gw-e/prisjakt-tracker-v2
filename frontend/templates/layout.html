<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Prodnest - Your nest for smarter buying" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/navbar.css') }}">
</head>

<body>
    <div id="blur">
        <nav>
            <div class="nav-main">
                <div class="nav-logo">
                    <p class="logo">
                        <span class="icon">0o</span>
                        ProdNest
                    </p>
                    <span class="hide-icon">🡠</span>
                </div>

                <input type="search" id="nav-quick-search" placeholder="Quick Search">

                <div class="navigation">
                    <ul>
                        <li>
                            <a href="/" class="active">
                                <span class="icon"></span>
                                <span class="lable">Home</span>
                            </a>
                        </li>
                        <li>
                            <a href="/" class="">
                                <span class="icon"></span>
                                <span class="lable">Products</span>
                            </a>
                        </li>
                        <li>
                            <a href="/" class="">
                                <span class="icon"></span>
                                <span class="lable">Watchlist</span>
                            </a>
                        </li>
                        <li>
                            <a href="/" class="">
                                <span class="icon"></span>
                                <span class="lable">Groups</span>
                                <span class="icon r">v</span>
                            </a>
                        </li>
                        <li>
                            <a href="/" class="">
                                <span class="icon"></span>
                                <span class="lable">Apps</span>
                                <span class="icon r">v</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="nav-bottom">
                <ul>
                    <li>
                        <a href="/">
                            <span class="icon"></span>
                            <span class="lable">Notifications</span>
                            <!-- <span class="icon">25</span> -->
                        </a>
                    </li>
                    <li>
                        <a href="/">
                            <span class="icon"></span>
                            <span class="lable">Settings</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>


</body>

</html>
